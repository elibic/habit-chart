# Builds the chart generator and publishes it to GitHub Pages on every push
# to main.
#
# It publishes by replacing the `gh-pages` branch, the same way the other
# static apps here do. That branch holds nothing but build output, so it is
# rewritten each time rather than added to.

name: פרסום לאתר

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# let a running deploy finish rather than cancelling it half-published
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: בדיקת קוד
        run: npm run lint

      - name: בנייה
        run: npm run build

      - name: פרסום לענף gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          touch .nojekyll          # serve _-prefixed asset paths verbatim
          git init -q
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
